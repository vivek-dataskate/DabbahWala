<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DabbahWala — Sign In</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #f4f4f7;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 48px 44px;
  max-width: 400px;
  width: 100%;
  margin: 20px;
  box-shadow: 0 4px 24px rgba(0,0,0,.08);
  text-align: center;
}

.logo { font-size: 3rem; line-height: 1; margin-bottom: 18px; }

.brand {
  font-size: 1.4rem;
  font-weight: 700;
  color: #1a1a2e;
  margin-bottom: 6px;
}

.subtitle {
  font-size: 0.88rem;
  color: #888;
  margin-bottom: 36px;
  line-height: 1.5;
}

.google-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  padding: 13px 20px;
  background: white;
  color: #3c4043;
  border: 1.5px solid #dadce0;
  border-radius: 8px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  transition: background 0.15s, box-shadow 0.15s;
}
.google-btn:hover {
  background: #f8f9fa;
  box-shadow: 0 2px 8px rgba(0,0,0,.1);
}

.google-icon {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
}

.divider {
  border: none;
  border-top: 1px solid #eee;
  margin: 28px 0;
}

.restriction {
  font-size: 0.78rem;
  color: #aaa;
  line-height: 1.5;
}

.restriction strong {
  color: #666;
}

/* Error banner */
.error-banner {
  background: #fff5f5;
  border: 1px solid #fecaca;
  border-radius: 8px;
  padding: 12px 16px;
  margin-bottom: 24px;
  font-size: 0.85rem;
  color: #991b1b;
  display: none;
  text-align: left;
}
.error-banner.show { display: block; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">🍱</div>
  <div class="brand">DabbahWala</div>
  <div class="subtitle">Internal Operations Dashboard</div>

  <div id="error-banner" class="error-banner"></div>

  <a href="/auth/google" class="google-btn">
    <svg class="google-icon" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>
    Sign in with Google
  </a>

  <hr class="divider">

  <div class="restriction">
    Access restricted to <strong>@dabbahwala.com</strong> accounts only.
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const error = params.get('error');
const banner = document.getElementById('error-banner');

const messages = {
  cancelled:      'Sign-in was cancelled. Please try again.',
  token_failed:   'Could not verify your Google account. Please try again.',
  userinfo_failed:'Could not retrieve account info from Google. Please try again.',
  unauthorized:   'Access denied. Only @dabbahwala.com Google accounts are allowed.',
};

if (error && messages[error]) {
  banner.textContent = messages[error];
  banner.classList.add('show');
}
</script>
</body>
</html>
