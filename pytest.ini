[pytest]
testpaths = tests
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*
log_cli = true
log_cli_level = WARNING
markers =
    n8n_live: marks tests that call the live n8n API (deselect with -m 'not n8n_live')
    external_connectivity: marks tests that call external APIs (Telnyx/Instantly/Airtable/Shipday) — set CONNECTIVITY_TESTS=1
    live_dw_api: marks tests that call the live production DW API via real HTTP — set LIVE_DW_API_TESTS=1
