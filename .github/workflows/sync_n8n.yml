name: Sync n8n Workflows

on:
  push:
    branches: [main]
    paths:
      - "n8n/**.json"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync workflows to n8n
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          N8N_BASE_URL: https://digitalworker.dataskate.io
        run: |
          set -e

          echo "Fetching existing workflows from n8n..."
          EXISTING=$(curl -sf \
            -H "X-N8N-API-KEY: $N8N_API_KEY" \
            "$N8N_BASE_URL/api/v1/workflows?limit=250")

          for file in n8n/*.json; do
            [[ "$file" == "n8n/config.json" ]] && continue

            WORKFLOW_NAME=$(jq -r '.name' "$file")
            WORKFLOW_ID=$(echo "$EXISTING" | jq -r --arg name "$WORKFLOW_NAME" \
              '.data[] | select(.name == $name) | .id // empty')
            WAS_ACTIVE=$(echo "$EXISTING" | jq -r --arg name "$WORKFLOW_NAME" \
              '.data[] | select(.name == $name) | .active // false')

            if [ -n "$WORKFLOW_ID" ]; then
              echo "Updating: $WORKFLOW_NAME (ID: $WORKFLOW_ID)"
              curl -sf -X PUT \
                -H "X-N8N-API-KEY: $N8N_API_KEY" \
                -H "Content-Type: application/json" \
                -d @"$file" \
                "$N8N_BASE_URL/api/v1/workflows/$WORKFLOW_ID" > /dev/null

              if [ "$WAS_ACTIVE" == "true" ]; then
                echo "  Re-activating: $WORKFLOW_NAME"
                curl -sf -X POST \
                  -H "X-N8N-API-KEY: $N8N_API_KEY" \
                  "$N8N_BASE_URL/api/v1/workflows/$WORKFLOW_ID/activate" > /dev/null
              fi
            else
              echo "Creating: $WORKFLOW_NAME"
              curl -sf -X POST \
                -H "X-N8N-API-KEY: $N8N_API_KEY" \
                -H "Content-Type: application/json" \
                -d @"$file" \
                "$N8N_BASE_URL/api/v1/workflows" > /dev/null
            fi

            echo "  Done: $WORKFLOW_NAME"
          done

          echo "All workflows synced."
